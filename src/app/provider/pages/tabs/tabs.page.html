<ion-header class="tabs-header">
  <ion-toolbar class="tabs-toolbar">

    <!-- Dynamic title -->
    <div slot="start" class="tabs-title-wrap">
      <span class="tabs-title" *ngIf="activeTab === 'home'">Inicio</span>
      <span class="tabs-title" *ngIf="activeTab === 'service-details'">Mis Servicios</span>
      <span class="tabs-title" *ngIf="activeTab === 'inbox'">Mensajes</span>
      <span class="tabs-title" *ngIf="activeTab === 'bookings'">Reservas</span>
      <span class="tabs-title" *ngIf="activeTab === 'profile'">Mi Perfil</span>
    </div>

 

  </ion-toolbar>
</ion-header>

<div class="tabs-content">
  <div class="tab-container" [class.tab-active]="activeTab === 'home'">
    <app-provider-home></app-provider-home>
  </div>
  <div class="tab-container" [class.tab-active]="activeTab === 'service-details'">
    <app-provider-service-details></app-provider-service-details>
  </div>
  <div class="tab-container" [class.tab-active]="activeTab === 'inbox'">
    <app-provider-inbox></app-provider-inbox>
  </div>
  <div class="tab-container" [class.tab-active]="activeTab === 'bookings'">
    <app-provider-bookings></app-provider-bookings>
  </div>
  <div class="tab-container" [class.tab-active]="activeTab === 'profile'">
    <app-provider-profile></app-provider-profile>
  </div>
  <router-outlet></router-outlet>
</div>

<!-- ── Bottom Tab Bar ──────────────────────────────────────────────── -->
<ion-footer class="tabs-footer">
    <div class="tab-bar">

      <button
        class="tab-btn"
        [class.tab-btn-active]="activeTab === 'home'"
        (click)="changeTab('home')"
        type="button">
        <div class="tab-icon-wrap">
          <ion-icon [name]="activeTab === 'home' ? 'home' : 'home-outline'"></ion-icon>
        </div>
        <span class="tab-label">Inicio</span>
      </button>

      <button
        class="tab-btn"
        [class.tab-btn-active]="activeTab === 'service-details'"
        (click)="changeTab('service-details')"
        type="button">
        <div class="tab-icon-wrap">
          <ion-icon [name]="activeTab === 'service-details' ? 'briefcase' : 'briefcase-outline'"></ion-icon>
        </div>
        <span class="tab-label">Servicios</span>
      </button>

      <button
        class="tab-btn"
        [class.tab-btn-active]="activeTab === 'inbox'"
        (click)="changeTab('inbox')"
        type="button">
        <div class="tab-icon-wrap">
          <ion-icon [name]="activeTab === 'inbox' ? 'chatbubbles' : 'chatbubbles-outline'"></ion-icon>
        </div>
        <span class="tab-label">Chat</span>
      </button>

      <button
        class="tab-btn"
        [class.tab-btn-active]="activeTab === 'bookings'"
        (click)="changeTab('bookings')"
        type="button">
        <div class="tab-icon-wrap">
          <ion-icon [name]="activeTab === 'bookings' ? 'calendar' : 'calendar-outline'"></ion-icon>
        </div>
        <span class="tab-label">Reservas</span>
      </button>

      <button
        class="tab-btn"
        [class.tab-btn-active]="activeTab === 'profile'"
        (click)="changeTab('profile')"
        type="button">
        <div class="tab-icon-wrap">
          <ion-icon [name]="activeTab === 'profile' ? 'person' : 'person-outline'"></ion-icon>
        </div>
        <span class="tab-label">Perfil</span>
      </button>

    </div>
</ion-footer>
