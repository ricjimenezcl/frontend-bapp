<div class="rm-container">

  <!-- Drag handle -->
  <div class="rm-drag-handle"></div>

  <!-- Header -->
  <div class="rm-header">
    <div class="rm-header-icon">
      <ion-icon name="star"></ion-icon>
    </div>
    <div class="rm-header-text">
      <h2 class="rm-title">Califica el servicio</h2>
      <p class="rm-subtitle">Tu opinión ayuda a otros usuarios</p>
    </div>
    <button class="rm-close-btn" (click)="dismiss()" type="button">
      <ion-icon name="close-outline"></ion-icon>
    </button>
  </div>

  <!-- Stars -->
  <div class="rm-stars-section">
    <p class="rm-stars-label">¿Cómo calificarías el servicio?</p>
    <div class="rm-stars-row">
      <button
        *ngFor="let star of stars"
        class="rm-star-btn"
        [class.rm-star-active]="star <= selectedRating"
        (click)="setRating(star)"
        type="button">
        <ion-icon [name]="star <= selectedRating ? 'star' : 'star-outline'"></ion-icon>
      </button>
    </div>
    <p class="rm-stars-value">
      <span *ngIf="selectedRating === 1">Muy malo</span>
      <span *ngIf="selectedRating === 2">Malo</span>
      <span *ngIf="selectedRating === 3">Regular</span>
      <span *ngIf="selectedRating === 4">Bueno</span>
      <span *ngIf="selectedRating === 5">¡Excelente!</span>
    </p>
  </div>

  <!-- Comment -->
  <div class="rm-comment-section">
    <label class="rm-comment-label">Comentario <span class="rm-optional">(opcional)</span></label>
    <textarea
      class="rm-textarea"
      [formControl]="$any(reviewForm.controls['comment'])"
      placeholder="Describe tu experiencia con el servicio..."
      rows="4"
      maxlength="500">
    </textarea>
    <p class="rm-char-count" *ngIf="isCheckingContent">Validando contenido...</p>
    <p class="rm-char-count" *ngIf="contentError" style="color:#ef4444;">{{ contentError }}</p>
    <p class="rm-char-count">{{ (reviewForm.value.comment?.length || 0) }}/500</p>
  </div>

  <!-- Actions -->
  <div class="rm-actions">
    <button
      class="rm-btn rm-btn-submit"
      [disabled]="isSubmitting || isCheckingContent"
      (click)="submit()"
      type="button">
      <ion-spinner *ngIf="isSubmitting" name="crescent"></ion-spinner>
      <ion-icon *ngIf="!isSubmitting" name="send-outline"></ion-icon>
      <span>{{ isSubmitting ? 'Enviando…' : 'Enviar reseña' }}</span>
    </button>
    <button
      class="rm-btn rm-btn-skip"
      (click)="dismiss()"
      type="button">
      <span>Después</span>
    </button>
  </div>

</div>
