<ion-header class="ion-no-border ep-header">
  <ion-toolbar class="ep-toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="cancel()" class="ep-back-btn">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="ep-title">Editar Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ep-content">
  <div class="ep-wrapper">

    <!-- ── Avatar ──────────────────────────────────────────────────── -->
    <div class="ep-avatar-section">
      <div class="ep-avatar-wrap" [class.ep-avatar-editing]="isEditing">
        <img
          [src]="avatar || 'assets/images/default-avatar.png'"
          class="ep-avatar"
          alt="Avatar"
          (error)="$any($event.target).src='assets/images/default-avatar.png'" />
        <button 
          class="ep-camera-btn" 
          (click)="changeAvatar()" 
          type="button"
          aria-label="Cambiar foto de perfil">
          <ion-icon name="camera"></ion-icon>
        </button>
      </div>
      <p class="ep-avatar-hint">
        <ion-icon name="camera-outline"></ion-icon>
        Toca el ícono para cambiar tu foto
      </p>
    </div>

    <!-- ── Form ──────────────────────────────────────────────────── -->
    <div class="ep-form">

      <div class="ep-field-group">
        <label class="ep-label">Nombre Completo</label>
        <div class="ep-input-wrap" [class.ep-input-disabled]="!isEditing">
          <ion-input
            type="text"
            [(ngModel)]="fullName"
            [disabled]="!isEditing"
            placeholder="Tu nombre completo"
            (ionBlur)="onFieldBlur('fullName')">
          </ion-input>
        </div>
        <div class="ep-error" *ngIf="fieldTouched['fullName'] && fieldErrors['fullName']">
          <ion-icon name="alert-circle-outline"></ion-icon>
          {{ fieldErrors['fullName'] }}
        </div>
      </div>

      <div class="ep-field-group">
        <label class="ep-label">Teléfono</label>
        <div class="ep-input-wrap" [class.ep-input-disabled]="!isEditing">
          <ion-input
            type="tel"
            [(ngModel)]="phone"
            [disabled]="!isEditing"
            maxlength="17"
            placeholder="+56 9 1234 5678"
            (ionInput)="formatPhone($event)"
            (ionBlur)="onPhoneBlur()">
          </ion-input>
        </div>
        <div class="ep-error" *ngIf="fieldTouched['fono'] && fieldErrors['fono']">
          <ion-icon name="alert-circle-outline"></ion-icon>
          {{ fieldErrors['fono'] }}
        </div>
      </div>

      <div class="ep-field-group">
        <label class="ep-label">Email</label>
        <div class="ep-input-wrap ep-input-disabled">
          <ion-input
            type="email"
            [value]="email"
            [disabled]="true"
            placeholder="correo@ejemplo.com">
          </ion-input>
        </div>
      </div>

      <div class="ep-field-group">
        <label class="ep-label">Sobre mí</label>
        <div class="ep-input-wrap ep-textarea-wrap" [class.ep-input-disabled]="!isEditing">
          <ion-input
            type="text"
            [(ngModel)]="bio"
            [disabled]="!isEditing"
            placeholder="Cuéntanos algo sobre ti..."
            (ionBlur)="onFieldBlur('bio')">
          </ion-input>
        </div>
        <div class="ep-error" *ngIf="fieldTouched['bio'] && fieldErrors['bio']">
          <ion-icon name="alert-circle-outline"></ion-icon>
          {{ fieldErrors['bio'] }}
        </div>
      </div>

    </div>

    <!-- ── Actions ─────────────────────────────────────────────────── -->
    <div class="ep-actions">

      <button class="ep-btn-primary" *ngIf="!isEditing" (click)="onPin()" type="button">
        <ion-icon name="create-outline"></ion-icon>
        Editar perfil
      </button>

      <div class="ep-btn-row" *ngIf="isEditing">
        <button class="ep-btn-ghost" (click)="cancelEdit()" type="button">
          Cancelar
        </button>
        <button
          class="ep-btn-primary"
          (click)="confirmEdit()"
          [disabled]="!isFormValid || isUpdating"
          type="button">
          <ion-spinner *ngIf="isUpdating" name="crescent" class="ep-spinner"></ion-spinner>
          <ion-icon *ngIf="!isUpdating" name="checkmark-circle-outline"></ion-icon>
          Guardar Cambios
        </button>
      </div>

    </div>

  </div>
</ion-content>
