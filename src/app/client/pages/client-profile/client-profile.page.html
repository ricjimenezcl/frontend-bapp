<ion-content class="profile-content">
  <div class="profile-wrapper">

    <!-- ── Profile header ────────────────────────────────────────────── -->
    <header class="profile-header">
      <div class="avatar-wrap">
        <img
          [src]="avatar || 'assets/images/default-avatar.png'"
          alt="Avatar"
          (error)="$any($event.target).src='assets/images/default-avatar.png'" />
      </div>
      <h1 class="profile-name">{{ fullName || 'Usuario' }}</h1>
      <p class="profile-email">{{ email }}</p>
    </header>

    <!-- ── Premium box ───────────────────────────────────────────────── -->
    <div class="premium-box">
      <h2 class="premium-title">
        <ion-icon name="shield-half-outline" class="premium-icon"></ion-icon>
        Cuenta Gratuita
      </h2>
      <div class="perk">
        <ion-icon name="checkmark-circle" class="perk-check"></ion-icon>
        Acceso ilimitado a búsquedas
      </div>
      <div class="perk">
        <ion-icon name="checkmark-circle" class="perk-check"></ion-icon>
        Sin límites de servicios guardados
      </div>
      <div class="perk">
        <ion-icon name="checkmark-circle" class="perk-check"></ion-icon>
        Contacta proveedores ilimitados
      </div>
      <button class="btn-premium" (click)="goToCatalog()" type="button">
        Actualizar A Premium
      </button>
    </div>

    <!-- ── Stats row ─────────────────────────────────────────────────── -->
    <div class="stats-row">
      <div class="stat-card">
        <ion-icon name="call" class="stat-icon"></ion-icon>
        <span class="stat-label">Teléfono</span>
        <span class="stat-value">{{ phone || 'Sin registrar' }}</span>
      </div>
      <div class="stat-card">
        <ion-icon name="mail" class="stat-icon"></ion-icon>
        <span class="stat-label">Email</span>
        <span class="stat-value">{{ email }}</span>
      </div>
    </div>

    <!-- ── Menu: Cuenta ───────────────────────────────────────────────── -->
    <p class="section-label">Cuenta</p>
    <div class="menu-group">

      <button class="menu-item" (click)="goToEditProfile()" type="button">
        <ion-icon name="person-outline" class="menu-item-icon"></ion-icon>
        <span class="menu-item-label">Editar perfil</span>
        <ion-icon name="chevron-forward-outline" class="menu-chevron"></ion-icon>
      </button>

      <button class="menu-item" (click)="goToTransactions()" type="button">
        <ion-icon name="receipt-outline" class="menu-item-icon"></ion-icon>
        <span class="menu-item-label">Mis Compras</span>
        <ion-icon name="chevron-forward-outline" class="menu-chevron"></ion-icon>
      </button>

      <button class="menu-item" (click)="goToCatalog()" type="button">
        <ion-icon name="storefront-outline" class="menu-item-icon menu-item-icon-gold"></ion-icon>
        <span class="menu-item-label">Tienda Premium</span>
        <div class="menu-tag">PREMIUM</div>
      </button>

    </div>

    <!-- ── Menu: Preferencias ─────────────────────────────────────────── -->
    <p class="section-label">Preferencias</p>
    <div class="menu-group">

      <button class="menu-item" (click)="goToSettings()" type="button">
        <ion-icon name="settings-outline" class="menu-item-icon"></ion-icon>
        <span class="menu-item-label">Configuración</span>
        <ion-icon name="chevron-forward-outline" class="menu-chevron"></ion-icon>
      </button>

      <button class="menu-item" (click)="inviteFriends()" type="button">
        <ion-icon name="gift-outline" class="menu-item-icon"></ion-icon>
        <span class="menu-item-label">Invitar amigos</span>
        <ion-icon name="chevron-forward-outline" class="menu-chevron"></ion-icon>
      </button>

      <button class="menu-item" (click)="goToTerms()" type="button">
        <ion-icon name="document-text-outline" class="menu-item-icon"></ion-icon>
        <span class="menu-item-label">Términos y condiciones</span>
        <ion-icon name="chevron-forward-outline" class="menu-chevron"></ion-icon>
      </button>

    </div>

    <!-- ── Logout ─────────────────────────────────────────────────────── -->
    <button class="btn-logout" (click)="goLogout()" type="button">
      <ion-icon name="power-outline"></ion-icon>
      Cerrar sesión
    </button>

    <div class="profile-footer-spacer"></div>
  </div>
</ion-content>
