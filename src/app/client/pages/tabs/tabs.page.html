<ion-header class="tabs-header">
  <ion-toolbar class="tabs-toolbar">

    <!-- Dynamic title -->
    <div slot="start" class="tabs-title-wrap">
      <span class="tabs-title" *ngIf="activeTab === 'service-search'">Proveedores</span>
      <span class="tabs-title" *ngIf="activeTab === 'service-map'">Mapa</span>
      <span class="tabs-title" *ngIf="activeTab === 'bookings'">Mis Reservas</span>
      <span class="tabs-title" *ngIf="activeTab === 'chats'">Mensajes</span>
      <span class="tabs-title" *ngIf="activeTab === 'client-profile'">Mi Perfil</span>
    </div>

    <!-- Actions slot -->
    <ion-buttons slot="end">
      <!-- Services count chip -->
      <div class="services-chip" *ngIf="selectedServices.length > 0" (click)="changeTab('service-search')">
        <ion-icon name="construct-outline"></ion-icon>
        <span>{{ selectedServices.length }}</span>
      </div>
      <!-- New search button -->
      <button class="new-search-btn" (click)="goToCategories()" type="button">
        <ion-icon name="search-outline"></ion-icon>
      </button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<!-- Tab content rendered by the router (ion-router-outlet caches each tab page) -->
<div class="tabs-content">
  <ion-router-outlet></ion-router-outlet>
</div>

<!-- ── Nav Dock ─────────────────────────────────────────────────── -->
<div class="nav-dock-outer">
  <nav class="nav-dock">

    <button
      class="dock-btn"
      [class.dock-btn-active]="activeTab === 'service-search'"
      (click)="changeTab('service-search')"
      type="button">
      <div class="dock-icon-wrap">
        <ion-icon [name]="activeTab === 'service-search' ? 'search' : 'search-outline'"></ion-icon>
        <span class="dock-badge" *ngIf="selectedServices.length > 0">{{ selectedServices.length }}</span>
      </div>
    </button>

    <button
      class="dock-btn"
      [class.dock-btn-active]="activeTab === 'service-map'"
      (click)="changeTab('service-map')"
      type="button">
      <div class="dock-icon-wrap">
        <ion-icon [name]="activeTab === 'service-map' ? 'map' : 'map-outline'"></ion-icon>
      </div>
    </button>

    <button
      class="dock-btn"
      [class.dock-btn-active]="activeTab === 'bookings'"
      (click)="changeTab('bookings')"
      type="button">
      <div class="dock-icon-wrap">
        <ion-icon [name]="activeTab === 'bookings' ? 'calendar' : 'calendar-outline'"></ion-icon>
      </div>
    </button>

    <button
      class="dock-btn"
      [class.dock-btn-active]="activeTab === 'chats'"
      (click)="changeTab('chats')"
      type="button">
      <div class="dock-icon-wrap">
        <ion-icon [name]="activeTab === 'chats' ? 'chatbubbles' : 'chatbubbles-outline'"></ion-icon>
      </div>
    </button>

    <button
      class="dock-btn"
      [class.dock-btn-active]="activeTab === 'client-profile'"
      (click)="changeTab('client-profile')"
      type="button">
      <div class="dock-icon-wrap">
        <ion-icon [name]="activeTab === 'client-profile' ? 'person' : 'person-outline'"></ion-icon>
      </div>
    </button>

  </nav>
</div>
