<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/client/settings"></ion-back-button>
    </ion-buttons>
    <ion-title>Cambiar Contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item>
      <ion-label position="floating">Contraseña Actual</ion-label>
      <ion-input [type]="showOldPassword ? 'text' : 'password'" [(ngModel)]="oldPassword"></ion-input>
      <ion-button fill="clear" slot="end" (click)="togglePasswordVisibility('old')">
        <ion-icon [name]="showOldPassword ? 'eye-outline' : 'eye-off-outline'"></ion-icon>
      </ion-button>
    </ion-item>
    <div class="error-message" *ngIf="submitted && !oldPassword">
      <span>La contraseña actual es requerida</span>
    </div>

    <ion-item>
      <ion-label position="floating">Nueva Contraseña</ion-label>
      <ion-input [type]="showNewPassword ? 'text' : 'password'" [(ngModel)]="newPassword"></ion-input>
      <ion-button fill="clear" slot="end" (click)="togglePasswordVisibility('new')">
        <ion-icon [name]="showNewPassword ? 'eye-outline' : 'eye-off-outline'"></ion-icon>
      </ion-button>
    </ion-item>
    <div class="error-message" *ngIf="submitted && newPassword && passwordErrors.length > 0">
      <span *ngFor="let err of passwordErrors">{{ err }}<br/></span>
    </div>

    <ion-item>
      <ion-label position="floating">Confirmar Nueva Contraseña</ion-label>
      <ion-input [type]="showConfirmPassword ? 'text' : 'password'" [(ngModel)]="confirmPassword"></ion-input>
      <ion-button fill="clear" slot="end" (click)="togglePasswordVisibility('confirm')">
        <ion-icon [name]="showConfirmPassword ? 'eye-outline' : 'eye-off-outline'"></ion-icon>
      </ion-button>
    </ion-item>
    <div class="error-message" *ngIf="submitted && confirmPassword && !passwordsMatch">
      <span>Las contraseñas no coinciden</span>
    </div>
  </ion-list>

  <ion-button expand="block" (click)="changePassword()" [disabled]="loading || !isFormValid">
    {{ loading ? 'Cambiando...' : 'Cambiar Contraseña' }}
  </ion-button>
</ion-content>
