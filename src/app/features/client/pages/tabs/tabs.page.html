<ion-header class="tabs-header">
  <ion-toolbar class="tabs-toolbar">

    <!-- Dynamic title -->
    <div slot="start" class="tabs-title-wrap">
      <span class="tabs-title" *ngIf="activeTab === 'home'">Inicio</span>
      <span class="tabs-title" *ngIf="activeTab === 'service-search'">Proveedores</span>
      <span class="tabs-title" *ngIf="activeTab === 'bookings'">Mis Reservas</span>
      <span class="tabs-title" *ngIf="activeTab === 'chats'">Mensajes</span>
      <span class="tabs-title" *ngIf="activeTab === 'client-profile'">Mi Perfil</span>
    </div>

    <!-- Actions slot -->
    <ion-buttons slot="end">
      <!-- Services count chip -->
      <div class="services-chip" *ngIf="selectedServices.length > 0" (click)="changeTab('service-search')">
        <ion-icon name="construct-outline"></ion-icon>
        <span>{{ selectedServices.length }}</span>
      </div>
      <!-- Profile button -->
      <button class="profile-btn" [class.profile-btn-active]="activeTab === 'client-profile'" (click)="changeTab('client-profile')" type="button">
        <ion-icon [name]="activeTab === 'client-profile' ? 'person' : 'person-outline'"></ion-icon>
      </button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<!-- Tab content rendered by the router (ion-router-outlet caches each tab page) -->
<div class="tabs-content">
  <ion-router-outlet></ion-router-outlet>
</div>

<!-- ── Bottom navigation (notch style) ─────────────────────────────── -->
<div class="app-tab-bar-wrap">
  <ion-tab-bar class="ion-no-border app-tab-bar">

    <ion-tab-button
      [class.tab-active]="activeTab === 'home'"
      (click)="changeTab('home')">
      <ion-icon [name]="activeTab === 'home' ? 'home' : 'home-outline'"></ion-icon>
    </ion-tab-button>

    <ion-tab-button
      class="notch-adjacent-left"
      [class.tab-active]="activeTab === 'service-search'"
      (click)="changeTab('service-search')">
      <ion-icon [name]="activeTab === 'service-search' ? 'list' : 'list-outline'"></ion-icon>
    </ion-tab-button>

    <!-- Hueco reservado: el FAB + notch flotan fuera de ion-tab-bar (ver abajo) -->
    <div class="fab-spacer"></div>

    <ion-tab-button
      class="notch-adjacent-right"
      [class.tab-active]="activeTab === 'bookings'"
      (click)="changeTab('bookings')">
      <ion-icon [name]="activeTab === 'bookings' ? 'calendar' : 'calendar-outline'"></ion-icon>
    </ion-tab-button>

    <ion-tab-button
      [class.tab-active]="activeTab === 'chats'"
      (click)="changeTab('chats')">
      <ion-icon [name]="activeTab === 'chats' ? 'chatbubbles' : 'chatbubbles-outline'"></ion-icon>
    </ion-tab-button>

  </ion-tab-bar>

  <!-- FAB + notch flotante: fuera de ion-tab-bar para evitar que su
       "contain: strict" interno recorte el botón al sobresalir -->
  <div class="fab-slot">
    <svg class="tab-notch" viewBox="0 0 100 50" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 0v50H0V0c.543 27.153 22.72 49 50 49S99.457 27.153 99.99 0h.01z" fill-rule="evenodd"></path>
    </svg>
    <div class="fab-halo">
      <ion-fab-button class="center-fab-btn" color="primary" (click)="goToCategories()">
        <ion-icon name="search-outline"></ion-icon>
      </ion-fab-button>
    </div>
  </div>
</div>
