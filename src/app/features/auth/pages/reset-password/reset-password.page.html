<ion-content>
  <div class="login-bg">
    <div class="login-wrap">

      <!-- Logo -->
      <div class="login-logo">
        <img src="assets/imgs/logo.png" alt="logo" class="logo-img">
        <img src="assets/imgs/titulo.png" alt="titulo" class="titulo-img">
        <p class="login-subtitle">Recupera el acceso a tu cuenta</p>
      </div>

      <!-- Card -->
      <div class="login-card">
        <h2 class="login-card-title">Restablecer contraseña</h2>
        <p class="login-card-subtitle">Ingresa tu correo y te enviaremos las instrucciones de recuperación.</p>

        <!-- Error alert -->
        <div *ngIf="errorMessage" class="error-alert">
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Success alert -->
        <div *ngIf="successMessage" class="success-alert">
          <span>{{ successMessage }}</span>
        </div>

        <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" novalidate class="login-form">

          <!-- Email -->
          <div class="form-group">
            <label class="form-label">Correo electrónico</label>
            <div class="input-wrap" [class.input-wrap-error]="resetForm.get('email')?.touched && resetForm.get('email')?.invalid">
              <span class="input-icon-svg" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="4" width="20" height="16" rx="2"/>
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                </svg>
              </span>
              <ion-input
                formControlName="email"
                type="email"
                placeholder="tu@email.com"
                autocomplete="email">
              </ion-input>
            </div>
            <span class="form-error" *ngIf="resetForm.get('email')?.touched && resetForm.get('email')?.errors?.['required']">El correo es requerido</span>
            <span class="form-error" *ngIf="resetForm.get('email')?.touched && resetForm.get('email')?.errors?.['email']">Ingresa un correo válido</span>
          </div>

          <!-- Submit -->
          <ion-button
            type="submit"
            expand="block"
            class="submit-btn"
            [disabled]="isLoading || resetForm.invalid">
            <ion-spinner *ngIf="isLoading" name="crescent" slot="start"></ion-spinner>
            <span>{{ isLoading ? "Enviando..." : "Enviar instrucciones" }}</span>
          </ion-button>

        </form>

        <!-- Back link -->
        <div class="back-link-wrap">
          <button type="button" class="back-link-btn" (click)="onBack()">
            ← Volver al inicio de sesión
          </button>
        </div>

      </div>

    </div>
  </div>
</ion-content>
