<ion-content class="ion-padding">
  <form [formGroup]="setPasswordForm" (ngSubmit)="onSubmit()">
    <h2>Restablecer contraseña</h2>
    <ion-label position="stacked">Nueva contraseña</ion-label>
    <ion-input type="password" formControlName="password" required></ion-input>
    <ion-text color="danger" *ngIf="setPasswordForm.get('password')?.touched && setPasswordForm.get('password')?.invalid">
      <small *ngIf="setPasswordForm.get('password')?.errors?.['required']">La contraseña es requerida</small>
      <small *ngIf="setPasswordForm.get('password')?.errors?.['minlength']">Mínimo 8 caracteres</small>
      <small *ngIf="setPasswordForm.get('password')?.errors?.['uppercaseRequired']">Debe contener al menos una mayúscula</small>
      <small *ngIf="setPasswordForm.get('password')?.errors?.['numberRequired']">Debe contener al menos un número</small>
    </ion-text>

    <ion-label position="stacked">Confirmar contraseña</ion-label>
    <ion-input type="password" formControlName="confirmPassword" required></ion-input>
    <ion-text color="danger" *ngIf="setPasswordForm.hasError('mismatch') && setPasswordForm.get('confirmPassword')?.touched">
      <small>Las contraseñas no coinciden.</small>
    </ion-text>

    <ion-button expand="block" type="submit" [disabled]="isLoading">Restablecer</ion-button>
    <ion-button expand="block" fill="clear" (click)="onBack()">Volver al login</ion-button>

    <ion-text color="danger" *ngIf="errorMessage">
      <p>{{ errorMessage }}</p>
    </ion-text>
    <ion-text color="success" *ngIf="successMessage">
      <p>{{ successMessage }}</p>
    </ion-text>
    <ion-spinner *ngIf="isLoading"></ion-spinner>
  </form>
</ion-content>
