<ion-content class="ion-padding">
  <div class="reset-password-screen">
    <ion-label class="title">Restablecer contraseña</ion-label>
    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="reset-form">
      <ion-item lines="none">
        <ion-label position="floating">Correo electrónico</ion-label>
        <ion-input formControlName="email" type="email" required></ion-input>
      </ion-item>
      <div *ngIf="resetForm.get('email')?.touched && resetForm.get('email')?.invalid" class="error-message">
        <ion-text color="danger" *ngIf="resetForm.get('email')?.errors?.['required']">
          El correo es requerido
        </ion-text>
        <ion-text color="danger" *ngIf="resetForm.get('email')?.errors?.['email']">
          Ingresa un correo válido
        </ion-text>
      </div>
      <div *ngIf="errorMessage" class="error-message">
        <ion-text color="danger">{{ errorMessage }}</ion-text>
      </div>
      <div *ngIf="successMessage" class="success-message">
        <ion-text color="success">{{ successMessage }}</ion-text>
      </div>
      <ion-button type="submit" expand="block" color="primary" [disabled]="isLoading || resetForm.invalid">
        <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
        <span *ngIf="!isLoading">Enviar instrucciones</span>
      </ion-button>
      <ion-button expand="block" fill="clear" color="medium" (click)="onBack()">
        Volver al login
      </ion-button>
    </form>
  </div>
</ion-content>
