name: QA — frontend-bapp (Mobile)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: qa-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1: Unit Tests (Karma / Jasmine)
  # ──────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Karma)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate environment files
        run: npm run set-env
        env:
          # Variables requeridas por set-env.js (valores de CI/CD secrets)
          API_URL: ${{ secrets.API_URL || 'https://api.bappsearch.com' }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN || '' }}

      - name: Run unit tests (headless + coverage)
        run: npm run test:ci
        env:
          CI: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-mobile-unit
          path: coverage/
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2: Build web (verifica compilación sin errores)
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build web (Capacitor shell)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Generate environment files
        run: npm run set-env
        env:
          API_URL: ${{ secrets.API_URL || 'https://api.bappsearch.com' }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN || '' }}

      - name: Build production
        run: npm run build:prod

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-mobile-web
          path: www/
          retention-days: 3

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3: E2E (Playwright — emulación mobile)
  # ──────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests — Mobile emulation (Playwright)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Generate environment files
        run: npm run set-env
        env:
          API_URL: ${{ secrets.API_URL || 'https://api.bappsearch.com' }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN || '' }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E tests (mobile emulation)
        run: npm run e2e:ci
        env:
          CI: true
          BASE_URL: http://localhost:4200

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-mobile
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload test results (screenshots/videos)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-mobile
          path: e2e/test-results/
          retention-days: 7
