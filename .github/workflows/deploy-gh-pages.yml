name: Deploy to GitHub Pages

on:
  push:
    branches:
      - pre-produccion

  # Permite ejecutar manualmente desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout del código ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Configurar Node.js 18 ──────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # ── 3. Instalar dependencias (reproducible desde package-lock.json) ───────
      - name: Install dependencies
        run: npm ci

      # ── 4. Inyectar variables de entorno (set-env.js lee process.env en CI) ──
      #    Agregar en GitHub → Settings → Secrets and variables → Actions:
      #      API_URL           = https://backend-bapp.onrender.com/api/v1
      #      GEOAPIFY_API_KEY  = <tu clave>
      #      GOOGLE_CLIENT_ID  = <tu client id>
      #      FACEBOOK_APP_ID   = <tu app id>
      - name: Build para GitHub Pages
        run: npm run build:gh
        env:
          API_URL:           ${{ secrets.API_URL }}
          GEOAPIFY_API_KEY:  ${{ secrets.GEOAPIFY_API_KEY }}
          GOOGLE_CLIENT_ID:  ${{ secrets.GOOGLE_CLIENT_ID }}
          FACEBOOK_APP_ID:   ${{ secrets.FACEBOOK_APP_ID }}

      # ── 5. Fix SPA routing: GitHub Pages usa 404.html para rutas no-archivo ──
      - name: Crear 404.html para Angular Router
        run: cp www/index.html www/404.html

      # ── 6. Desactivar Jekyll (evita que GH Pages ignore carpetas con _) ───────
      - name: Agregar .nojekyll
        run: touch www/.nojekyll

      # ── 7. Publicar en rama gh-pages ─────────────────────────────────────────
      - name: Deploy a gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          publish_branch: gh-pages
          commit_message: 'deploy: ${{ github.sha }}'
